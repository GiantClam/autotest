# Add the generic project lifecycle tools to a DeepSeek Harness profile.
- insert:
    - id: autosoftwarefactory-project-lifecycle
      name: '@giantclam/dsh-autosoftwarefactory'
      config:
        # Set AUTOSOFTWAREFACTORY_ROOT when the plugin is installed outside this checkout.
        autosoftwarefactoryRoot: !!js process.env.AUTOSOFTWAREFACTORY_ROOT
